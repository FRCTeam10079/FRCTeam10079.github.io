<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Gallery</title>
        <meta name="description" content="A gallery of images from ArrowDynamics, FRC Team 10079 at Bothell High School.">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="images/arrowdynamicslogo.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">

</head>
<body>
<div class="content-wrap">
    <script src="layout.js" data-page="gallery"></script>

    <main class="site-content">
        <section class="page-hero">
            <p class="eyebrow">Gallery</p>
            <h1>Moments from the Season</h1>
            <p>A collection of images from ArrowDynamics, FRC Team 10079 at Bothell High School.</p>
        </section>

        <section class="gallery-section reveal">
            <div class="gallery-grid">
                <figure class="gallery-item">
                    <img src="images/10079%20Team%20Picture.jpg" alt="ArrowDynamics team group photo">
                    <figcaption>ArrowDynamics Team 10079</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="images/teamphoto.jpg" alt="ArrowDynamics students with their robot">
                    <figcaption>Building together</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="images/Robot%202026.jpg" alt="ArrowDynamics 2026 competition robot">
                    <figcaption>Our 2026 competition robot</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="images/arrowdynamics-frc-team-robot.jpeg" alt="ArrowDynamics robot at an event">
                    <figcaption>On the field</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="images/arrowdynamicslogo.png" alt="ArrowDynamics team logo">
                    <figcaption>ArrowDynamics</figcaption>
                </figure>
            </div>
        </section>
    </main>

</div>
<script>renderFooter()</script>
<script src="script.js"></script>
</body>

</html>
